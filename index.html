<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Car Shooter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="start-screen">
    <h1>BotForge Presents</h1>
    <h2>Neon Car Shooter</h2>
    <button onclick="startGame()">▶ Start Game</button>
  </div>

  <canvas id="gameCanvas" width="600" height="400" style="display: none"></canvas>

  <div class="ui" id="gameUI" style="display: none">
    <p>Score: <span id="score">0</span> | High Score: <span id="highScore">0</span></p>
    <button id="resetBtn">Restart Game</button>
    <button onclick="toggleMute()" id="muteBtn">🔊</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
